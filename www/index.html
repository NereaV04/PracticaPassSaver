<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <script src="javascript.js"></script>
  <title>Pass Saver</title>
</head>

<body id="index-body">
  <main>

    <h1>Pass Saver</h1>

    <hr>

    <button class="add-button" id="add-category">Add Categorie</button>

    <dialog id="category-dialog" class="category-dialog">
      <p>Nueva categoria</p>
      <hr>
      <form id="category-form" class="category-form">

        <label for="category-name">Nombre:</label>
        <input type="text" id="category-name" name="name" required placeholder="Nombre de la categoria">

        <div class="category-form__buttons">
          <button type="reset" class="category-form__buttons--cancel"
            id="category-form__buttons--cancel">Cancel</button>
          <button type="submit" class="category-form__buttons--ok" id="category-form__buttons--ok">Ok</button>
        </div>

      </form>
    </dialog>

    <button class="add-button" id="add-site">Add Site</button>

    <br><br>
    <section class="tables-contain">

      <div>
        <!-- Cattegories table -->
        <table class="categories-table">
          <thead>
            <tr>
              <th class="categories-table__header">Categories</th>
            </tr>
          </thead>

          <tbody id="category-body">
            <tr>
              <td class="categories-table__body">sadsad</td>
            </tr>

          </tbody>
        </table>
      </div>

      <div>
        <!-- Sites table-->
        <table class="sites-table">
          <thead>
            <tr>
              <th class="sites-table__header">Sitio</th>
              <th class="sites-table__header">User</th>
              <th class="sites-table__header">Created at</th>
              <th class="sites-table__header">Actions</th>
            </tr>
          </thead>

          <tbody id="sites-body">
            <!-- <tr>
              <td class="sites-table__body">Google</td>
              <td class="sites-table__body">User</td>
              <td class="sites-table__body">10/10/2026</td>
              <td class="sites-table__body">
                <div>
                  <a href="${site.url}" target="_blank">
                    <i class="fa-solid fa-up-right-from-square"></i>
                  </a>
                </div>
              </td>
            </tr> -->
          </tbody>
        </table>
      </div>

    </section>

  </main>
</body>

</html>
